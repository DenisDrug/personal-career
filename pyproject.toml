[project]
name = "personal-career"
version = "0.1.0"
description = "Personal job search and Telegram notification service"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
  "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
personal-career = "career.main:main"

[tool.ruff]
line-length = 100
